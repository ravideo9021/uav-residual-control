# ResLand configuration - paper_default preset (schema 1.0)
# Every value cites its source: [T1] = paper Table I, [Sx] = paper section, [P] = proposed implementation decision,
# TBC = open item to confirm with the guide (see specification Appendix A).
schema_version: "1.0"
sim:
  dt: 0.01            # s [T1]
  T: 12.0             # s [T1]
  z0: 4.0             # m [T1]
  v_des: 0.42         # m/s [T1]
  m: 1.5              # kg [T1]
  J_x: 0.020          # kg m^2 [T1]
  g: 9.81             # m/s^2
  integrator: semi_implicit   # [P] OI-04 TBC
  phi_divergence: 1.5708      # rad [P] FR-ERR-01
init:
  vz0: 0.0            # m/s [P] OI-08 TBC
  vy0_mode: zero      # zero | match_platform  [P] OI-08 TBC
  p0: 0.0             # rad/s [P] OI-08 TBC
noise:
  sigma_z: 0.010      # m [T1]
  sigma_vz: 0.030     # m/s [T1]
  sigma_phi: 0.004    # rad [T1]
  sigma_p: 0.020      # rad/s [T1]
  process: TBC        # OI-05
  accel: TBC          # DOB accelerometer noise, OI-12
profiles:
  nominal:  {K_phi: 0.12, L: 0.35, lambda_slip: 0.60, n_phi: 2.0, A_GE: 1.8, R_z: 0.55, n_z: 2.0}   # [T1]
  mismatch: {K_phi: 0.168, L: 0.455, lambda_slip: 1.00, n_phi: 1.6, A_GE: 2.43, R_z: 0.77, n_z: 1.6} # [S VII-D]
randomisation:          # [S V-B]
  K_phi: [0.80, 1.20]
  A_GE: [0.85, 1.15]
  J_x: [0.90, 1.10]
  v_p: [0.90, 1.10]
  y0_sd: 0.5          # m
  phi0_sd: 0.03       # rad
controllers:
  vertical: {K_P: 2.2, K_D: 2.6, K_I: 1.6}   # [T1]
  roll: {K_P: 60.0, K_D: 11.0, K_I: 30.0}    # [T1]
  lateral: TBC                               # OI-01
  reference: ramp                            # z_ref = max(z0 - v_des t, 0) [P] OI-03
  dob_tau: 1.0                               # s [S V-C]
  limits: null                               # [P] OI-21
residual:
  W: 4                                       # [S VI-B]
  hidden: [64, 64, 32]
  activation: tanh
  training:
    n_trajectories: 400
    v_p_range: [0.0, 4.0]
    held_out: 60
    n_windows: 200000
    lambda_reg: 1.0e-5
    lr: 8.0e-4
    lr_decay: 0.94
    batch: 256
    dropout: 0.05
    input_noise: 0.02
    grad_clip: 5.0
    patience: 6
    data_seed: 42
    init_seed: 1
gate:
  d0_quantile: 0.99                          # [S IV-D]
  kappa: TBC                                 # OI-10
  d0_scale: 1.0
thresholds: {phi_max: 0.10, vz_max: 0.75, dvy_max: 0.75, z_final: 1.0}   # [S V-D]
plan:
  name: speed_sweep
  controllers: [PD, PID, PID+DOB, Res-NG, Res-G]
  speeds: [0.0, 1.5, 3.0, 5.0, 6.0]
  n_trials: 500
  master_seed: TBC                           # OI-16
  train_profile: nominal
  eval_profile: nominal
statistics: {bootstrap_resamples: 20000, bootstrap_seed: TBC, ci_level: 0.95}
