<path d="M200.0,250.0 L185.0,257.5" fill="none" stroke="#3b4a60" stroke-width="1.4" marker-end="url(#open)"/>
<path d="M180.0,450.0 L215.0,450.0" fill="none" stroke="#3b4a60" stroke-width="1.4" marker-end="url(#open)"/>
