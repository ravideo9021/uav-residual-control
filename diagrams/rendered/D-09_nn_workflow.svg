<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" font-family="Arial, Liberation Sans, Helvetica, sans-serif">
<defs><marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#3b4a60" stroke-width="1.6"/></marker><marker id="block" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#3b4a60"/></marker><marker id="inherit" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1,1 L15,8 L1,15 Z" fill="#ffffff" stroke="#3b4a60" stroke-width="1.4"/></marker><marker id="compose" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#3b4a60"/></marker><marker id="aggregate" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#ffffff" stroke="#3b4a60" stroke-width="1.3"/></marker></defs>
<rect width="1100" height="575" fill="#ffffff"/>
<rect x="10" y="10" width="1080" height="335" rx="6" fill="#e7f0fb" stroke="#1f4e8c" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="20" y="29" font-size="13" font-weight="bold" fill="#1f4e8c">Training workflow (offline; CLI: resland generate / train / calibrate)</text>
<rect x="10" y="360" width="1080" height="205" rx="6" fill="#fff4e0" stroke="#b26b00" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="20" y="379" font-size="13" font-weight="bold" fill="#b26b00">Inference workflow (every step, 100 Hz loop, NumPy)</text>
<path d="M260.0,92.5 L290.0,92.5" fill="none" stroke="#3b4a60" stroke-width="1.4" marker-end="url(#open)"/>
<path d="M520.0,92.5 L550.0,92.5" fill="none" stroke="#3b4a60" stroke-width="1.4" marker-end="url(#open)"/>
<path d="M780.0,92.5 L810.0,92.5" fill="none" stroke="#3b4a60" stroke-width="1.4" marker-end="url(#open)"/>
