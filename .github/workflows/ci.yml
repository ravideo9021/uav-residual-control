name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: RTM check (RT-03)
        run: python tools/rtm_check.py spec/rtm.csv
      - name: Spec consistency + generated files up to date
        run: |
          python tools/build_all.py
          git diff --exit-code -- spec docs/paper/figures || (echo "::error::Generated files are stale: run python tools/build_all.py and commit"; exit 1)
